# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Point Render at this repo and it provisions the service from this file:
# no manual field entry beyond the two Turso secrets it will prompt for.
#
# Deploy:
#   1. Push this file to GitHub (done if you can read it there)
#   2. render.com -> New -> Blueprint -> pick the SafaiTrack repo
#   3. Paste DATABASE_URL and DATABASE_AUTH_TOKEN when prompted
#   4. Apply
#
# See docs/DEPLOYMENT.md for the Turso half.

services:
  - type: web
    name: safaitrack
    runtime: node
    plan: free
    # Closest Render region to Dhaka — keeps latency sane for a demo in Bangladesh.
    region: singapore

    # `--include=dev` is load-bearing, not decorative. Render sets
    # NODE_ENV=production on Node services, which makes npm skip
    # devDependencies — and vite, esbuild, typescript and the Tailwind plugin
    # all live there. Without this flag the build dies on "vite: not found".
    # `npm run setup` creates and seeds the demo database as part of the build.
    # When DATABASE_URL is left blank the app uses a local SQLite file, and
    # that file is not in the repo — without this step the service comes up
    # with an empty database and every request that touches it returns 500.
    # Render's disk resets to the build snapshot on each restart, so the demo
    # data comes back clean every time the free service wakes up.
    buildCommand: npm install --include=dev && npm run build && npm run setup
    startCommand: npm start

    # Render restarts the service if this stops returning 200.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Turso connection — optional. Leave both blank and the service runs on
      # the seeded SQLite file from the build step (data resets on restart).
      # Fill them in for a persistent hosted database; see docs/DEPLOYMENT.md.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false

      # Generated by Render, never seen by us or committed anywhere.
      - key: JWT_SECRET
        generateValue: true

      # Optional. Left blank, the assistant runs its offline advisor and the
      # UI says so — the app is fully functional without it.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
